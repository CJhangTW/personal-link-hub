services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-personal_links}"
      POSTGRES_USER: "${POSTGRES_USER:-personal_links}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-personal_links} -d ${POSTGRES_DB:-personal_links}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      DEBUG: "${DEBUG:-0}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-personal_links}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-personal_links}"
      POSTGRES_DB: "${POSTGRES_DB:-personal_links}"
      POSTGRES_USER: "${POSTGRES_USER:-personal_links}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
    expose:
      - "8000"
    command: >-
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2
      --access-logfile - --error-logfile -"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro

volumes:
  postgres_data:
  static_data:
